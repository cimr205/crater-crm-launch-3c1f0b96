    <!-- Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Hvad er inkluderet i prisen?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Alt. CRM, HR, Fakturering, Opgavestyring, Kalender, Inbox, AI-features og API-adgang er inkluderet i én pris pr. bruger."
          }
        },
        {
          "@type": "Question",
          "name": "Kan jeg importere data fra andre systemer?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ja, vi understøtter CSV-import af leads, kunder og medarbejderdata. Du kan også bruge vores API til automatisk integration."
          }
        },
        {
          "@type": "Question",
          "name": "Er mine data sikre og GDPR-klar?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Vi bruger enterprise-grade kryptering, daglige backups og overholder GDPR fuldt ud. Dine data er hostet i EU."
          }
        },
        {
          "@type": "Question",
          "name": "Er der binding?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Nej, du kan opsige når som helst. Ingen binding, ingen skjulte gebyrer."
          }
        },
        {
          "@type": "Question",
          "name": "Hvad koster AI Agency Danmark?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "AI Agency Danmark koster 499 kr. per bruger per måned. Alle funktioner er inkluderet. Du kan prøve gratis i 14 dage uden kreditkort."
          }
        }
      ]
    }
    </script>
