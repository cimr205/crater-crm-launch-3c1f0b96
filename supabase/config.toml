project_id = "crater-crm"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:8080"
additional_redirect_urls = ["http://localhost:8080"]
jwt_expiry = 3600
enable_refresh_token_rotation = true

[functions.event-dispatcher]
verify_jwt = false

[functions.mcp-server]
verify_jwt = false

[functions.autopilot-agent]
verify_jwt = false

[functions.autopilot-brief]
verify_jwt = false

[functions.autopilot-brief-tts]
verify_jwt = true

[functions.autopilot-execute]
verify_jwt = true

[functions.webhook-dispatch]
verify_jwt = false

[functions.workflow-runner]
verify_jwt = false

[functions.gmail-send]
verify_jwt = false

[functions.icp-score]
verify_jwt = false
